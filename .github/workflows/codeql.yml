name: CodeQL (static analysis)

# Stage 9: static application security testing for the TypeScript code (API and web apps). Findings appear in the repository's
# Security tab and block nothing automatically; the security owner triages them (docs/SECURITY_TESTING_HANDOFF.md).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
