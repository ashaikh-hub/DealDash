name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/postgres
      DATABASE_URL: postgresql://dealdash_app:ci-app-password@localhost:5432/dealdash_dev
      TEST_DATABASE_URL: postgresql://dealdash_app:ci-app-password@localhost:5432/dealdash_test
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the Prisma client is generated code (gitignored, apps/api/src/generated) and Prisma 7 no longer creates it on
      # install: generate it before anything compiles the API (same step as infra/docker/api.Dockerfile)
      - name: Generate Prisma client
        run: pnpm --filter @dealdash/api db:generate
      - name: Secret scan (no credentials in the repository)
        run: node tooling/security/secret-scan.mjs
      - name: Prepare databases (role, databases, PostGIS)
        run: pnpm --filter @dealdash/api db:setup
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Build shared packages
        run: pnpm build:packages
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations apply cleanly from empty (test database)
        run: pnpm db:test:reset
      - name: Migrations match the Prisma schema (no drift)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Unit, integration, API, tenant-isolation and shell tests
        run: pnpm test
      - name: OpenAPI contract is up to date
        run: |
          pnpm api:contract
          git diff --exit-code packages/api-client
      - name: Build all apps
        run: pnpm build
      - name: Dependency audit (critical severity blocks the build)
        run: pnpm audit --prod --audit-level critical
      - name: Dependency audit (high severity, reported for triage)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
