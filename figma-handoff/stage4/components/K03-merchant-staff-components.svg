<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" data-frame="K03 Merchant Staff components"><rect width="1200" height="900" fill="#fff"/><text x="24" y="40" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="22" font-weight="800" fill="#0F0C42" text-anchor="start">K03 Merchant Staff components (Stage 4)</text><text x="24" y="80" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Scanner viewport</text><rect x="24" y="92" width="240" height="240" rx="24" fill="#0B0A2E"/><rect x="74" y="142" width="140" height="140" rx="18" fill="none" stroke="#fff" stroke-width="3"/><text x="300" y="80" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Manual entry</text><rect x="300" y="92" width="300" height="64" rx="14" fill="#fff" stroke="#5B1AFC" stroke-width="2"/><text x="450" y="134" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="26" font-weight="800" fill="#0F0C42" text-anchor="middle" direction="ltr" unicode-bidi="isolate">K7QM-9T2X</text><rect x="300" y="172" width="300" height="52" rx="26" fill="#5B1AFC"/><text x="450" y="203" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Check code</text><text x="640" y="80" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Result cards: tone map</text><rect x="640" y="92" width="520" height="68" rx="20" fill="#E2F7F0" stroke="#1FBF8F" stroke-width="2"/><text x="660" y="120" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="14" font-weight="800" fill="#0F0C42" text-anchor="start">green: success</text><text x="660" y="142" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Valid · Redeemed</text><rect x="640" y="172" width="520" height="68" rx="20" fill="#FEF1D9" stroke="#F5A524" stroke-width="2"/><text x="660" y="200" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="14" font-weight="800" fill="#0F0C42" text-anchor="start">amber: recoverable</text><text x="660" y="222" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Expired · Not valid yet · Wrong branch</text><rect x="640" y="252" width="520" height="68" rx="20" fill="#FDE8EB" stroke="#E93A52" stroke-width="2"/><text x="660" y="280" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="14" font-weight="800" fill="#0F0C42" text-anchor="start">red: hard failure</text><text x="660" y="302" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Invalid · Already redeemed · Not eligible · Not active · Campaign suspended</text><text x="24" y="380" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Buttons</text><rect x="24" y="392" width="300" height="56" rx="28" fill="#0E8F6A"/><text x="174" y="425" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Redeem (opens the confirmation sheet)</text><rect x="340" y="392" width="300" height="56" rx="28" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="490" y="425" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#0F0C42" text-anchor="middle">Cancel</text><rect x="656" y="392" width="300" height="56" rx="28" fill="#5B1AFC"/><text x="806" y="425" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Scan next</text><text x="24" y="490" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Journey: SCAN → VALIDATE → REDEEM</text><rect x="24" y="504" width="230" height="70" rx="18" fill="#EEE8FF"/><text x="139" y="546" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="18" font-weight="800" fill="#0F0C42" text-anchor="middle">SCAN</text><text x="269" y="546" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="22" font-weight="800" fill="#5B5E80" text-anchor="middle" direction="ltr" unicode-bidi="isolate">→</text><rect x="284" y="504" width="230" height="70" rx="18" fill="#FEF1D9"/><text x="399" y="546" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="18" font-weight="800" fill="#0F0C42" text-anchor="middle">VALIDATE</text><text x="529" y="546" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="22" font-weight="800" fill="#5B5E80" text-anchor="middle" direction="ltr" unicode-bidi="isolate">→</text><rect x="544" y="504" width="230" height="70" rx="18" fill="#E2F7F0"/><text x="659" y="546" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="18" font-weight="800" fill="#0F0C42" text-anchor="middle">REDEEM</text><text x="640" y="380" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Confirmation sheet</text><rect x="640" y="392" width="330" height="56" rx="14" fill="#FEF1D9"/><text x="654" y="425" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#8A5A00" text-anchor="start">This cannot be undone. Once redeemed…</text><text x="990" y="380" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Torch (when supported)</text><circle cx="1040" cy="420" r="26" fill="#F5A524"/><text x="1090" y="380" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">OTP</text><rect x="1090" y="392" width="14" height="40" rx="4" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="1107" y="392" width="14" height="40" rx="4" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="1124" y="392" width="14" height="40" rx="4" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="1141" y="392" width="14" height="40" rx="4" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="1158" y="392" width="14" height="40" rx="4" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="1175" y="392" width="14" height="40" rx="4" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="24" y="620" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Targets</text><text x="24" y="644" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">All tap targets &gt;= 56 px high. Result colour is never the only signal: every state has a glyph and a plain-language title.</text><text x="24" y="668" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Idempotency-Key is created once per confirm and reused on retry. Success is only shown after the server confirms.</text></svg>