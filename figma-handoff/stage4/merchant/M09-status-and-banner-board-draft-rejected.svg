<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" data-frame="M09 Status and banner board (Draft … Rejected)"><rect width="1440" height="900" fill="#F8F9FD"/><rect x="0" y="0" width="240" height="900" rx="0" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="24" y="44" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="22" font-weight="800" fill="#5B1AFC" text-anchor="start">DealDash</text><text x="24" y="62" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="500" fill="#5B5E80" text-anchor="start">DealDash for Business</text><text x="28" y="112" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Dashboard</text><text x="28" y="152" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Profile</text><text x="28" y="192" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Branches</text><text x="28" y="232" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Team</text><rect x="12" y="250" width="216" height="34" rx="10" fill="#EEE8FF"/><text x="28" y="272" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="800" fill="#5B1AFC" text-anchor="start">Campaigns</text><text x="28" y="312" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Redemptions</text><text x="28" y="352" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Insights</text><text x="28" y="392" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Finance</text><rect x="240" y="0" width="1200" height="64" rx="0" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="1000" y="18" width="46" height="23" rx="11.5" fill="#EEF0F8"/><text x="1023" y="31" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#5B5E80" text-anchor="middle">عربي</text><text x="970" y="40" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="end">Najd Kitchen</text><text x="272" y="100" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="24" font-weight="800" fill="#0F0C42" text-anchor="start">Exclusive Deal statuses (merchant view)</text><rect x="272" y="130" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="142" width="55" height="24" rx="12" fill="#EEF0F8"/><text x="315.5" y="156" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="middle">Draft</text><text x="462" y="161" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Edit freely. Autosaves every 30 s.</text><rect x="272" y="192" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="204" width="83" height="24" rx="12" fill="#FEF1D9"/><text x="329.5" y="218" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#8A5A00" text-anchor="middle">In review</text><text x="462" y="223" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Being reviewed. Editing is locked.</text><rect x="272" y="254" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="266" width="139" height="24" rx="12" fill="#FEF1D9"/><text x="357.5" y="280" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#8A5A00" text-anchor="middle">Changes requested</text><text x="462" y="285" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">DealDash asked for changes (reason shown, EN/AR). Fix &amp; resubmit.</text><rect x="272" y="316" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="328" width="83" height="24" rx="12" fill="#EEE8FF"/><text x="329.5" y="342" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B1AFC" text-anchor="middle">Scheduled</text><text x="462" y="347" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Approved, starts later. Wording fixes only.</text><rect x="272" y="378" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="390" width="48" height="24" rx="12" fill="#E2F7F0"/><text x="312" y="404" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0B7A5A" text-anchor="middle">Live</text><text x="462" y="409" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Visible to customers. Pause, cancel, add stock, wording fixes.</text><rect x="272" y="440" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="452" width="62" height="24" rx="12" fill="#EEF0F8"/><text x="319" y="466" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="middle">Paused</text><text x="462" y="471" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Hidden. Merchant pause can resume; DealDash pause cannot.</text><rect x="272" y="502" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="514" width="76" height="24" rx="12" fill="#FEF1D9"/><text x="326" y="528" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#8A5A00" text-anchor="middle">Sold out</text><text x="462" y="533" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">No units left. Visible and marked. Add stock reopens it.</text><rect x="272" y="564" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="576" width="55" height="24" rx="12" fill="#EEF0F8"/><text x="315.5" y="590" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="middle">Ended</text><text x="462" y="595" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Ended. Held reservations stay valid until their hold ends.</text><rect x="272" y="626" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="638" width="83" height="24" rx="12" fill="#EEF0F8"/><text x="329.5" y="652" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="middle">Cancelled</text><text x="462" y="657" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Ended early. Held reservations cancelled, customers told.</text><rect x="272" y="688" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="700" width="76" height="24" rx="12" fill="#FDE8EB"/><text x="326" y="714" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#B3203A" text-anchor="middle">Rejected</text><text x="462" y="719" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Not approved. Reason shown.</text><rect x="272" y="750" width="900" height="50" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="762" width="83" height="24" rx="12" fill="#FDE8EB"/><text x="329.5" y="776" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#B3203A" text-anchor="middle">Suspended</text><text x="462" y="781" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Stopped by DealDash. Redemption blocked.</text></svg>