eight="600" fill="#0F0C42" text-anchor="start">Customers</text><text x="28" y="392" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Audit log</text><text x="28" y="432" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Configuration</text><rect x="240" y="0" width="1200" height="64" rx="0" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="1000" y="18" width="46" height="23" rx="11.5" fill="#EEF0F8"/><text x="1023" y="31" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#5B5E80" text-anchor="middle">عربي</text><text x="970" y="40" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="end">Operations</text><rect x="0" y="0" width="1440" height="900" rx="0" fill="#0F0C42" opacity="0.45"/><rect x="470" y="180" width="540" height="470" rx="20" fill="#fff"/><text x="494" y="224" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="18" font-weight="800" fill="#0F0C42" text-anchor="start">Request changes</text><text x="494" y="250" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Every decision is recorded with your name, the time and this rea</text><text x="494" y="290" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="start">Reason (required, shown to the merchant)</text><rect x="494" y="298" width="492" height="80" rx="12" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="508" y="343" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Please add that the offer is dine-in only.</text><text x="494" y="410" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="start">Reason in Arabic (optional)</text><rect x="494" y="418" width="492" height="80" rx="12" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="508" y="463" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">يرجى ذكر أن العرض للتناول في المطعم فقط.</text><text x="494" y="540" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#B3203A" text-anchor="start">Please give a reason (at least 3 characters)</text><rect x="884" y="580" width="102" height="44" rx="22" fill="#5B1AFC"/><text x="935" y="607" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Confirm</text><rect x="764" y="580" width="100" height="44" rx="22" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="814" y="607" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="middle">Cancel</text></svg>