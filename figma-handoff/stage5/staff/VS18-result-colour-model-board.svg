<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" data-frame="VS18 Result colour model (board)"><rect width="390" height="844" fill="#F8F9FD"/><text x="16" y="40" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="18" font-weight="800" fill="#0F0C42" text-anchor="start">Staff result colours (Stage 4 model, extended)</text><rect x="16" y="70" width="358" height="106" rx="20" fill="#E2F7F0" stroke="#0B7A5A" stroke-width="2"/><text x="32" y="98" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="14" font-weight="800" fill="#0F0C42" text-anchor="start">green: success</text><text x="32" y="124" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Valid reservation</text><text x="32" y="150" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Redeemed</text><rect x="16" y="200" width="358" height="132" rx="20" fill="#FEF1D9" stroke="#F5A524" stroke-width="2"/><text x="32" y="228" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="14" font-weight="800" fill="#0F0C42" text-anchor="start">amber: recoverable</text><text x="32" y="254" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Not valid yet</text><text x="32" y="280" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Reservation not completed</text><text x="32" y="306" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Wrong branch</text><rect x="16" y="350" width="358" height="210" rx="20" fill="#FDE8EB" stroke="#C9213D" stroke-width="2"/><text x="32" y="378" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="14" font-weight="800" fill="#0F0C42" text-anchor="start">red: hard failure</text><text x="32" y="404" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Code not recognised</text><text x="32" y="430" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Already used</text><text x="32" y="456" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Voucher on hold</text><text x="32" y="482" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Voucher refunded</text><text x="32" y="508" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Offer not available right now</text><text x="32" y="534" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">•  Reservation cancelled</text><text x="16" y="560" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Colour is never the only signal: every result has a glyph, a title and a next action.</text></svg>