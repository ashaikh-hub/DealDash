s Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#5B5E80" text-anchor="middle">The voucher was released. Nothing was</text><text x="195" y="442" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#5B5E80" text-anchor="middle">charged. You can start again.</text></svg>