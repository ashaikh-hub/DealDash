<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" data-frame="VC13 Payment page (provider hand-off; test page in dev)"><rect width="390" height="844" fill="#F8F9FD"/><rect x="16" y="24" width="358" height="74" rx="14" fill="#EEE8FF"/><text x="30" y="50" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="800" fill="#0F0C42" text-anchor="start">Test payment page</text><text x="30" y="70" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="500" fill="#5B5E80" text-anchor="start">This page stands in for the payment provider</text><text x="30" y="86" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="500" fill="#5B5E80" text-anchor="start">while we build. Nothing is charged.</text><rect x="16" y="114" width="358" height="236" rx="20" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A6B"/><stop offset="1" stop-color="#581845"/></linearGradient></defs><rect x="32" y="130" width="48" height="48" rx="14" fill="url(#g0)"/><text x="92" y="150" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="14" font-weight="800" fill="#0F0C42" text-anchor="start">SAR 120 dinner voucher</text><text x="92" y="168" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Najd Kitchen</text><text x="32" y="210" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Voucher value</text><text x="358" y="210" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="end" direction="ltr" unicode-bidi="isolate">SAR 120.00</text><text x="32" y="236" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Voucher price</text><text x="358" y="236" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="end" direction="ltr" unicode-bidi="isolate">SAR 90.00</text><text x="32" y="262" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Quantity</text><text x="358" y="262" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="end" direction="ltr" unicode-bidi="isolate">1</text><text x="32" y="288" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Reported savings</text><text x="358" y="288" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="end" direction="ltr" unicode-bidi="isolate">SAR 30.00</text><line x1="32" y1="310" x2="358" y2="310" stroke="#E3E1F0" stroke-width="1"/><text x="32" y="336" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="15" font-weight="800" fill="#0F0C42" text-anchor="start">Amount to pay</text><text x="358" y="336" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="17" font-weight="800" fill="#0F0C42" text-anchor="end" direction="ltr" unicode-bidi="isolate">SAR 90.00</text><rect x="16" y="372" width="358" height="52" rx="26" fill="#5B1AFC"/><text x="195" y="403" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Approve payment</text><rect x="16" y="436" width="358" height="52" rx="26" fill="#E93A52"/><text x="195" y="467" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Decline payment</text><text x="195" y="520" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#5B5E80" text-anchor="middle">Back without paying</text></svg>