 font-size="11" font-weight="700" fill="#0F0C42" text-anchor="middle">Offer not availabl</text><text x="620" y="80" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Voucher detail facts</text><rect x="620" y="92" width="520" height="230" rx="20" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><text x="640" y="128" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Voucher</text><text x="1120" y="128" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="800" fill="#0F0C42" text-anchor="end" direction="ltr" unicode-bidi="isolate">SAR 120 dinner voucher</text><text x="640" y="166" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Voucher value</text><text x="1120" y="166" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="800" fill="#0F0C42" text-anchor="end" direction="ltr" unicode-bidi="isolate">SAR 120.00</text><text x="640" y="204" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Customer</text><text x="1120" y="204" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="800" fill="#0F0C42" text-anchor="end">Layla</text><text x="640" y="242" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Branch</text><text x="1120" y="242" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="800" fill="#0F0C42" text-anchor="end">Al Nakheel</text><text x="640" y="280" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Reference</text><text x="1120" y="280" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="800" fill="#0F0C42" text-anchor="end" direction="ltr" unicode-bidi="isolate">VC-K7QM9T</text><text x="620" y="350" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Confirmation sheet warning</text><rect x="620" y="362" width="520" height="78" rx="14" fill="#FEF1D9"/><text x="636" y="388" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#8A5A00" text-anchor="start">This cannot be undone by staff. The full voucher value is used now and</text><text x="636" y="406" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#8A5A00" text-anchor="start">the code stops working.</text><text x="24" y="470" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Confirm button (locked after tap)</text><rect x="24" y="482" width="360" height="56" rx="28" fill="#0E8F6A"/><text x="204" y="515" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Confirm redemption</text><text x="24" y="580" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B5E80" text-anchor="start">Rules</text><text x="24" y="606" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">All tap targets &gt;= 56 px. A result is never colour-only: glyph + title + next action.</text><text x="24" y="630" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Idempotency-Key is created once per confirm and reused on retry; success is shown only after the server confirms.</text><text x="24" y="654" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Staff see the value to honour and the customer first name; never a phone number.</text></svg>