<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" data-frame="VM17 Dialogs: pause, end sale, capacity, reverse use"><rect width="1440" height="900" fill="#F8F9FD"/><text x="32" y="44" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="22" font-weight="800" fill="#0F0C42" text-anchor="start">Merchant dialogs</text><rect x="32" y="80" width="420" height="330" rx="20" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><text x="56" y="120" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="17" font-weight="800" fill="#0F0C42" text-anchor="start">Pause sales</text><text x="56" y="256" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="start">Reason</text><rect x="56" y="266" width="372" height="70" rx="12" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="56" y="350" width="120" height="40" rx="20" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="116" y="375" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="middle">Cancel</text><rect x="192" y="350" width="236" height="40" rx="20" fill="#5B1AFC"/><text x="310" y="375" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Pause sales</text><rect x="484" y="80" width="420" height="330" rx="20" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><text x="508" y="120" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="17" font-weight="800" fill="#0F0C42" text-anchor="start">End the sale?</text><text x="508" y="150" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">New purchases stop. Vouchers customers already</text><text x="508" y="168" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">bought stay valid and can still be used. This</text><text x="508" y="186" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">cannot be undone.</text><text x="508" y="256" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="start">Reason *</text><rect x="508" y="266" width="372" height="70" rx="12" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="508" y="350" width="120" height="40" rx="20" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="568" y="375" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="middle">Cancel</text><rect x="644" y="350" width="236" height="40" rx="20" fill="#E93A52"/><text x="762" y="375" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">End sale</text><rect x="32" y="440" width="420" height="330" rx="20" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><text x="56" y="480" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="17" font-weight="800" fill="#0F0C42" text-anchor="start">Reverse this redemption?</text><text x="56" y="510" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">The voucher becomes usable again and the money</text><text x="56" y="528" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">moves back to held. A reason is required and it is</text><text x="56" y="546" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">recorded.</text><text x="56" y="616" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="start">Reason *</text><rect x="56" y="626" width="372" height="70" rx="12" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="56" y="710" width="120" height="40" rx="20" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="116" y="735" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="middle">Cancel</text><rect x="192" y="710" width="236" height="40" rx="20" fill="#E93A52"/><text x="310" y="735" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Reverse use</text><rect x="484" y="440" width="420" height="330" rx="20" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><text x="508" y="480" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="17" font-weight="800" fill="#0F0C42" text-anchor="start">Capacity</text><text x="508" y="510" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">Adding capacity lets you sell more. You can only</text><text x="508" y="528" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">remove capacity that is still unsold.</text><rect x="508" y="560" width="372" height="36" rx="18" fill="#EEF0F8"/><rect x="511" y="563" width="183" height="30" rx="15" fill="#fff"/><text x="602" y="583" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="800" fill="#5B1AFC" text-anchor="middle">Add capacity</text><text x="786" y="583" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="600" fill="#5B5E80" text-anchor="middle">Remove capacity</text><text x="508" y="620" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="start">Amount</text><rect x="508" y="628" width="160" height="40" rx="12" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="522" y="653" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start" direction="ltr" unicode-bidi="isolate">10</text><rect x="508" y="700" width="372" height="40" rx="20" fill="#5B1AFC"/><text x="694" y="725" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Add capacity</text></svg>