<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" data-frame="VM13 Voucher status board (all merchant-visible states)"><rect width="1440" height="900" fill="#F8F9FD"/><rect x="0" y="0" width="240" height="900" rx="0" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="24" y="44" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="22" font-weight="800" fill="#5B1AFC" text-anchor="start">DealDash</text><text x="24" y="62" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="500" fill="#5B5E80" text-anchor="start">DealDash for Business</text><text x="28" y="112" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Dashboard</text><text x="28" y="152" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Profile</text><text x="28" y="192" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Branches</text><text x="28" y="232" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Team</text><text x="28" y="272" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Campaigns</text><rect x="12" y="290" width="216" height="34" rx="10" fill="#EEE8FF"/><text x="28" y="312" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="800" fill="#5B1AFC" text-anchor="start">Vouchers</text><text x="28" y="352" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Redemptions</text><text x="28" y="392" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Insights</text><text x="28" y="432" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F0C42" text-anchor="start">Finance</text><rect x="240" y="0" width="1200" height="64" rx="0" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="1000" y="18" width="46" height="23" rx="11.5" fill="#EEF0F8"/><text x="1023" y="31" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#5B5E80" text-anchor="middle" unicode-bidi="plaintext">عربي</text><text x="970" y="40" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="end">Najd Kitchen</text><text x="272" y="100" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="22" font-weight="800" fill="#0F0C42" text-anchor="start">Voucher statuses and what the merchant sees</text><rect x="272" y="130" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="142" width="52" height="23" rx="11.5" fill="#EEF0F8"/><text x="314" y="155" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#5B5E80" text-anchor="middle">Draft</text><text x="472" y="161" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Edit everything; Submit for review</text><rect x="272" y="192" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="204" width="78" height="23" rx="11.5" fill="#FEF1D9"/><text x="327" y="217" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#8A5A00" text-anchor="middle">In review</text><text x="472" y="223" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">This Exclusive Deal is being reviewed. You cannot edit it meanwhile.</text><rect x="272" y="254" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="266" width="129" height="23" rx="11.5" fill="#FEF1D9"/><text x="352.5" y="279" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#8A5A00" text-anchor="middle">Changes requested</text><text x="472" y="285" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">DealDash asked for changes: reviewer reason shown; edit and resubmit</text><rect x="272" y="316" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="328" width="78" height="23" rx="11.5" fill="#EEE8FF"/><text x="327" y="341" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#5B1AFC" text-anchor="middle">Scheduled</text><text x="472" y="347" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Approved; goes on sale at the start time; wording edits only</text><rect x="272" y="378" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="390" width="65" height="23" rx="11.5" fill="#E2F7F0"/><text x="320.5" y="403" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#0B7A5A" text-anchor="middle">On sale</text><text x="472" y="409" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Selling; Pause, End, Add capacity, wording edits</text><rect x="272" y="440" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="452" width="59" height="23" rx="11.5" fill="#EEF0F8"/><text x="317.5" y="465" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#5B5E80" text-anchor="middle">Paused</text><text x="472" y="471" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">DealDash paused this voucher. Contact DealDash to resume it.</text><rect x="272" y="502" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="514" width="72" height="23" rx="11.5" fill="#FEF1D9"/><text x="324" y="527" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#8A5A00" text-anchor="middle">Sold out</text><text x="472" y="533" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">All units sold or held; add capacity to reopen</text><rect x="272" y="564" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="576" width="84" height="23" rx="11.5" fill="#EEF0F8"/><text x="330" y="589" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#5B5E80" text-anchor="middle">Sale ended</text><text x="472" y="595" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Sale ended; sold vouchers stay valid and redeemable</text><rect x="272" y="626" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="638" width="72" height="23" rx="11.5" fill="#FDE8EB"/><text x="324" y="651" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#B3203A" text-anchor="middle">Rejected</text><text x="472" y="657" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">Rejected with a reason; create a new voucher</text><rect x="272" y="688" width="1136" height="52" rx="14" fill="#FFFFFF" stroke="#E3E1F0" stroke-width="1"/><rect x="288" y="700" width="78" height="23" rx="11.5" fill="#FDE8EB"/><text x="327" y="713" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#B3203A" text-anchor="middle">Suspended</text><text x="472" y="719" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="500" fill="#0F0C42" text-anchor="start">DealDash suspended this voucher: it cannot be sold and vouchers already sold cannot be redeemed until it is reinstated.</text></svg>