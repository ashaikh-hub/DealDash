t">reversed. This is how a used voucher can later be</text><text x="396" y="426" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="500" fill="#5B5E80" text-anchor="start">refunded. A reason is required.</text><text x="396" y="480" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#5B5E80" text-anchor="start">Reason (required, recorded) *</text><rect x="396" y="490" width="432" height="80" rx="12" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><rect x="396" y="590" width="120" height="40" rx="20" fill="#fff" stroke="#E3E1F0" stroke-width="1"/><text x="456" y="615" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0F0C42" text-anchor="middle">Cancel</text><rect x="532" y="590" width="296" height="40" rx="20" fill="#E93A52"/><text x="680" y="615" font-family="'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Reverse redemption</text></svg>