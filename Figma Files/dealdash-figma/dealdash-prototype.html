<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DealDash prototype: Home to Claim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F0C42; --navy-2:#0A0830; --purple:#5B1AFC; --purple-2:#7E4DFF; --lilac:#EEE8FF;
  --mint:#1FBF8F; --amber:#F5A524; --red:#E93A52;
  --bg:#F8F9FD; --card:#FFFFFF; --ink:#0F0C42; --ink-2:#5B5E80; --line:#E3E1F0;
  --shadow:0 1px 2px rgba(20,22,58,.06),0 6px 18px rgba(20,22,58,.07);
  --stage:#E9E7F5;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0E2B; --card:#171A47; --ink:#F2F1FF; --ink-2:#A6A9D3; --line:#2A2E66; --lilac:#25226B;
    --shadow:0 1px 2px rgba(0,0,0,.3); --stage:#070819;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0E2B; --card:#171A47; --ink:#F2F1FF; --ink-2:#A6A9D3; --line:#2A2E66; --lilac:#25226B;
  --shadow:0 1px 2px rgba(0,0,0,.3); --stage:#070819;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);background:var(--stage);color:var(--ink);display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--purple-2);outline-offset:2px;border-radius:12px}

.phone{position:relative;width:100%;height:100%;max-width:400px;max-height:820px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){.phone{height:min(820px,96vh);border-radius:36px;box-shadow:0 30px 80px rgba(12,14,43,.35);border:8px solid var(--navy-2)}}

.screen{position:absolute;inset:0;bottom:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:84px}
.scroll.nonav{padding-bottom:110px}

/* Home header */
.hero{background:linear-gradient(160deg,var(--navy-2),var(--navy) 55%,#2B1F7A);color:#fff;padding:18px 18px 64px;border-radius:0 0 28px 28px}
.loc{display:flex;align-items:center;justify-content:space-between}
.loc small{display:block;opacity:.65;font-size:11px}
.loc b{font-size:15px;font-weight:700}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--purple);display:grid;place-items:center;font-weight:700;font-size:13px}
.hero h1{font-size:25px;line-height:1.15;font-weight:800;margin:18px 0 0;letter-spacing:-.4px;max-width:15ch}
.search{margin:-26px 18px 0;position:relative;z-index:2;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);color:var(--ink-2);font-size:14px;width:calc(100% - 36px);text-align:left}
.search svg{flex:none}

.cards-row{display:flex;gap:8px;margin:16px 18px 0;align-items:center;font-size:12px;color:var(--ink-2)}
.chip-card{display:inline-flex;align-items:center;gap:6px;background:var(--lilac);color:var(--ink);padding:6px 10px;border-radius:999px;font-weight:600;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 18px 10px}
.sec h2{font-size:17px;font-weight:800;letter-spacing:-.2px}
.sec button{font-size:13px;color:var(--purple);font-weight:700}

/* Five product lines */
.lines{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:0 18px}
.line{background:var(--card);border-radius:18px;padding:14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:104px;grid-column:span 3}
.line.wide{grid-column:span 6;flex-direction:row;align-items:center;gap:14px;min-height:0;background:linear-gradient(120deg,var(--navy),#4A12D6);color:#fff}
.line .ic{width:36px;height:36px;border-radius:12px;background:var(--lilac);display:grid;place-items:center;color:var(--purple)}
.line.wide .ic{background:rgba(255,255,255,.14);color:#fff}
.line b{font-size:14px;font-weight:700;display:block}
.line span.t{font-size:12px;color:var(--ink-2)}
.line.wide span.t{color:rgba(255,255,255,.75)}
.line.main{grid-column:span 6;background:var(--purple);color:#fff;flex-direction:row;align-items:center;min-height:0}
.line.main .ic{background:rgba(255,255,255,.18);color:#fff}
.line.main span.t{color:rgba(255,255,255,.85)}
.line.main .arr{margin-left:auto;opacity:.9}

.pills{display:flex;gap:8px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600;box-shadow:var(--shadow);color:var(--ink-2)}
.pill.on{background:var(--navy);color:#fff}
:root[data-theme="dark"] .pill.on{background:var(--purple)}

/* Deal card */
.deal{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:10px;box-shadow:var(--shadow);text-align:left;width:100%}
.thumb{width:84px;height:92px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px;position:relative}
.t1{background:linear-gradient(140deg,#4A12D6,#7E4DFF)}
.t2{background:linear-gradient(140deg,#0E7C66,#1FBF8F)}
.t3{background:linear-gradient(140deg,#B4376B,#F27A9A)}
.t4{background:linear-gradient(140deg,#0F0C42,#4B4FA8)}
.deal .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.deal h3{font-size:15px;font-weight:700}
.deal .m{font-size:12px;color:var(--ink-2)}
.off{font-size:20px;font-weight:800;color:var(--purple);letter-spacing:-.4px}
:root[data-theme="dark"] .off{color:var(--purple-2)}
.meter{height:6px;border-radius:99px;background:var(--lilac);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--red));border-radius:99px}
.left{font-size:11px;font-weight:700;color:var(--red)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--lilac);color:var(--purple);align-self:flex-start}
.tag.go{background:rgba(31,191,143,.15);color:var(--mint)}
.hlist{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 8px;scrollbar-width:none}
.hlist::-webkit-scrollbar{display:none}
.hcard{flex:none;width:230px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;text-align:left}
.hcard .top{height:104px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;font-size:26px;letter-spacing:-.5px}
.hcard .bt{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.hcard h3{font-size:14px;font-weight:700}
.hcard .m{font-size:12px;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:12px;padding:0 18px}

/* Nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-2);padding:4px 0}
.nav button.on{color:var(--purple)}
:root[data-theme="dark"] .nav button.on{color:var(--purple-2)}

/* Top bars */
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg)}
.bar h1{font-size:17px;font-weight:800;flex:1}
.back{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}

/* Detail */
.cover{height:210px;position:relative;display:flex;align-items:flex-end;padding:18px;color:#fff;background:linear-gradient(150deg,#0F0C42,#4A12D6 60%,#7E4DFF)}
.cover .back{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.cover h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.cover small{display:block;opacity:.8;font-size:13px;margin-top:2px}
.panel{background:var(--card);margin:-18px 14px 0;border-radius:22px;padding:18px;box-shadow:var(--shadow);position:relative;z-index:2}
.big{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--purple);line-height:1}
:root[data-theme="dark"] .big{color:var(--purple-2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fine{font-size:12px;color:var(--ink-2);line-height:1.5}
.divider{height:1px;background:var(--line);margin:14px 0}
.elig{display:flex;gap:10px;align-items:flex-start;background:rgba(31,191,143,.12);border-radius:14px;padding:12px;font-size:13px;line-height:1.45}
.elig b{display:block}
.terms{padding:0 22px;margin-top:18px}
.terms h2{font-size:15px;font-weight:800;margin-bottom:8px}
.terms li{font-size:13px;color:var(--ink-2);margin:0 0 6px 16px;line-height:1.5}

.cta{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;z-index:5}
.cta .p{flex:none;line-height:1.2}
.cta .p b{font-size:16px;display:block}
.cta .p span{font-size:11px;color:var(--ink-2)}
.btn{flex:1;background:var(--purple);color:#fff;font-weight:700;font-size:15px;padding:15px 18px;border-radius:16px;text-align:center}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--lilac);color:var(--purple)}
.btn.dark{background:var(--navy);}

/* Sheet */
.scrim{position:absolute;inset:0;background:rgba(12,14,43,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21}
.sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
.sum{background:var(--bg);border-radius:16px;padding:14px;margin:14px 0;display:flex;flex-direction:column;gap:9px;font-size:14px}
.sum .row b{font-weight:700}
.paywith{display:flex;align-items:center;gap:12px;border:1.5px solid var(--purple);border-radius:14px;padding:12px;margin-bottom:14px;font-size:13px}
.visa{width:42px;height:28px;border-radius:7px;background:linear-gradient(120deg,#1A1F71,#3B4BC8);display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;font-style:italic}
.sheet .btn{display:block;width:100%}

/* Claim */
.ticket{margin:6px 18px 0;background:var(--card);border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ticket .hd{background:linear-gradient(150deg,var(--navy),#4A12D6);color:#fff;padding:20px 20px 24px}
.ticket .hd small{opacity:.75;font-size:12px}
.ticket .hd h2{font-size:22px;font-weight:800;margin:2px 0 12px;letter-spacing:-.4px}
.timer{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.14);padding:8px 12px;border-radius:12px;font-size:13px;font-weight:600}
.timer b{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.perf::before{left:-31px}.perf::after{right:-31px}
.ticket .bd{padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.qr{width:176px;height:176px;background:#fff;border-radius:14px;padding:10px}
.code{font-size:22px;font-weight:800;letter-spacing:4px;font-variant-numeric:tabular-nums}
.steps{margin:18px 22px 0;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.step i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--lilac);color:var(--purple);font-style:normal;font-weight:800;font-size:12px;display:grid;place-items:center}
.step b{color:var(--ink)}

.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--navy-2);color:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.22s;z-index:40;white-space:nowrap;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.searchbox{margin:0 16px 12px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);color:var(--ink-2)}
.searchbox input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);min-width:0}
.searchbox:focus-within{outline:2px solid var(--purple-2)}
.empty{margin:30px 24px;text-align:center;color:var(--ink-2);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty .btn{display:inline-block;margin-top:16px;flex:none}
.ends{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--red)}
.pts{display:flex;align-items:center;justify-content:space-between;margin:6px 18px 0;background:linear-gradient(130deg,var(--navy),#4A12D6);color:#fff;border-radius:22px;padding:18px}
.pts .n{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.pts small{opacity:.75;font-size:12px}
.streak{display:flex;gap:6px;margin-top:10px}
.streak i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.streak i.on{background:var(--amber);color:var(--navy-2)}
.mile{margin:14px 18px 0;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.mile .meter{height:8px}
.mile .meter i{background:linear-gradient(90deg,var(--purple),var(--mint))}
.clip{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px;box-shadow:var(--shadow);width:100%;text-align:left}
.clip .thumb{width:60px;height:60px;font-size:22px}
.clip .bd{flex:1;min-width:0}
.clip h3{font-size:14px;font-weight:700}
.clip.done{opacity:.55}
.gain{font-size:12px;font-weight:800;color:var(--mint)}
.btn.sm{flex:none;padding:10px 16px;font-size:13px;border-radius:12px}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 18px 0}
.gift{aspect-ratio:1;border-radius:20px;background:linear-gradient(150deg,var(--purple),#4A12D6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;text-align:center;padding:8px;box-shadow:var(--shadow);transition:transform .2s}
.gift:active{transform:scale(.95)}
.gift.open{background:var(--card);color:var(--ink)}
.gift[disabled]{opacity:.5;cursor:not-allowed}
.prize{margin:16px 18px 0;background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);font-size:14px;line-height:1.5}
.wrow{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);width:100%;text-align:left}
.wrow .thumb{width:52px;height:52px;font-size:20px;border-radius:14px}
.wrow .bd{flex:1;min-width:0}
.wrow h3{font-size:14px;font-weight:700}
.player{position:absolute;inset:0;background:linear-gradient(160deg,var(--navy-2),#4A12D6);color:#fff;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
.player.on{display:flex}
.player .big2{font-size:64px;font-weight:800;width:130px;height:130px;border-radius:32px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.player .prog{position:absolute;left:18px;right:18px;top:calc(18px + env(safe-area-inset-top,0px));height:5px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.player .prog i{display:block;height:100%;width:0;background:#fff}
.player .x{position:absolute;right:16px;top:calc(34px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-size:18px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;text-align:left}
.nav[hidden]{display:none}


.thumb{overflow:hidden}
svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.st{animation:steam 3.2s ease-in-out infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(7px);opacity:0}35%{opacity:.85}100%{transform:translateY(-9px);opacity:0}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.7}100%{transform:translateY(-260px) scale(1.2);opacity:0}}
@keyframes pop{0%{transform:scale(0) rotate(-18deg)}70%{transform:scale(1.12) rotate(-8deg)}100%{transform:scale(1) rotate(-8deg)}}
.hcard .top{position:relative;overflow:hidden}
.hcard .top::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(12,14,43,.7),rgba(12,14,43,0) 65%)}
.hcard .top .tx{position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.cover{overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(12,14,43,.85),rgba(12,14,43,.05) 70%)}
.cover>div{position:relative;z-index:1}
.cover .back{z-index:2}
/* ads */
.ads{margin-top:18px}
.adtrack{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px;scrollbar-width:none}
.adtrack::-webkit-scrollbar{display:none}
.ad{position:relative;flex:0 0 88%;height:152px;border-radius:22px;overflow:hidden;scroll-snap-align:start;text-align:left;color:#fff;box-shadow:var(--shadow);background:var(--navy)}
.ad svg.art{animation:kb 11s ease-in-out infinite alternate}
.ad::after{content:"";position:absolute;inset:0;background:linear-gradient(95deg,rgba(12,14,43,.88),rgba(12,14,43,.25) 70%)}
.adin{position:absolute;inset:0;z-index:1;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.adin h3{font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.1;max-width:13ch}
.adin p{font-size:12px;opacity:.85}
.spons{position:absolute;top:12px;left:14px;font-size:10px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:7px;backdrop-filter:blur(4px)}
.adbtn{align-self:flex-start;margin-top:6px;background:#fff;color:var(--navy);font-weight:700;font-size:12px;padding:7px 13px;border-radius:999px}
.ad.inline{flex:none;width:100%;height:132px}
.addots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.addots i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:.2s}
.addots i.on{width:18px;background:var(--purple)}
/* reels strip */
.rthumb{position:relative;flex:none;width:112px;height:184px;border-radius:18px;overflow:hidden;color:#fff;text-align:left;box-shadow:var(--shadow);background:var(--navy)}
.rthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(12,14,43,.8),rgba(12,14,43,0) 55%)}
.rplay{position:absolute;z-index:1;top:50%;left:50%;transform:translate(-50%,-60%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.28);backdrop-filter:blur(4px);display:grid;place-items:center}
.rname{position:absolute;z-index:1;left:10px;bottom:10px;right:8px;font-size:12px;font-weight:700}

function reelHTML(r,i){var m=M[r.m],bk='';for(var k=0;k<6;k++){bk+='<i style="left:'+(8+k*16)+'%;width:'+(8+(k%3)*5)+'px;height:'+(8+(k%3)*5)+'px;animation-delay:'+(k*1.1)+'s"></i>';}
 return '<div class="reel" data-i="'+i+'">'+bigArt(m)+'<div class="bokeh">'+bk+'</div><div class="rscrim"></div><div class="sticker">'+r.stk+'</div>'
 +'<div class="rail"><button data-act="like" data-p="'+r.id+'" aria-label="Like">'+ic('heart',30)+'<small>'+r.likes+'</small></button><button class="hv'+(st.fav['r:'+r.id]?' on':'')+'" data-act="fav" data-p="r:'+r.id+'" aria-label="Save">'+ic('grid',28)+'<small>Save</small></button><button data-act="rshare" aria-label="Share">'+ic('share',28)+'<small>Share</small></button><button data-act="rmute" aria-label="Sound">'+ic('sound',28)+'<small>Sound</small></button></div>'
 +'<div class="rbot"><div class="who"><span class="thumb '+m.tone+'">'+art(m)+'</span>'+m.name+'<button class="fol" data-act="rfollow" data-p="'+m.id+'">'+(st.follow[m.id]?'Following':'Follow')+'</button></div><p><b>'+r.title+'</b><br>'+r.cap+'</p>'+(rewardAvail(r)?'<div class="rwline">'+ic('gift',14)+' Watch to unlock: <b>'+r.reward.t+'</b> &bull; '+r.reward.left+' left</div>':'')+'<div class="rrow"><button class="btn" data-act="reeldeal" data-p="'+r.d+'">View deal</button><span class="earn'+(st.clips[r.id]?' done':'')+'" data-earn="'+r.id+'">'+(st.clips[r.id]?'+'+r.sec+' earned':'+'+r.sec+' pts · '+r.sec+'s')+'</span></div></div></div>';}

/* ---- Reel viewing with fraud and farming protection ---- */
var attOpen=false,attTO=null,WATCH_CAP=150;
function rmsg(t){var e=$('#rmsg');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on')},3800);}
function lockLeft(){return Math.max(0,st.watchLock-Date.now());}
function showAtt(done){attOpen=true;$('#att').classList.add('on');var n=5;$('#attt').textContent=n+'s';clearInterval(attTO);attTO=setInterval(function(){n--;$('#attt').textContent=n+'s';if(n<=0){clearInterval(attTO);attOpen=false;$('#att').classList.remove('on');done(false);}},1000);window._attDone=function(){clearInterval(attTO);attOpen=false;$('#att').classList.remove('on');done(true);};}
function grantReward(r){var rw=r.reward;if(!rw||rw.left<1||st.rwGot[r.id])return;rw.left--;st.rwGot[r.id]=true;var m=M[r.m],cl=null;
 if(rw.k==='points'){st.points+=0;addPoints(rw.pts,'Instant reward.');}else{cl=addClaim({dealId:'rw_'+r.id,m:r.m,kind:'reward',title:rw.t+' at '+m.name,card:null});}
 var cf='';for(var i=0;i<14;i++)cf+='<i style="left:'+(4+i*7)+'%;background:'+['#5B1AFC','#E93A52','#F5A524','#1FBF8F'][i%4]+';animation-delay:'+(i%5)*0.12+'s"></i>';
 var el=$('#rwreveal');el.innerHTML='<div class="rwr"><div class="conf" aria-hidden="true">'+cf+'</div><div class="gresi">'+ic('gift',36)+'</div><h2>Instant reward unlocked!</h2><p><b>'+rw.t+'</b><br>Funded by '+m.name+(cl?'. Added to My Deals.':'.')+'</p>'+(cl?'<button class="btn" data-act="rwview" data-p="'+cl.id+'">View reward</button>':'')+'<button class="btn ghost" data-act="rwclose">Keep watching</button></div>';el.classList.add('on');}
function completeReel(r){st.clips[r.id]=true;st.strikes=0;var pts=Math.min(r.sec,Math.max(0,WATCH_CAP-st.watchPts));st.watchPts+=pts;if(pts>0)addPoints(pts,'Verified view.');
 var e=$('[data-earn="'+r.id+'"]');if(e){e.textContent='+'+pts+' earned';e.classList.add('done');}
 grantReward(r);if(Object.keys(st.clips).length===3){st.plays++;setTimeout(function(){toast('Combo! 3 reels watched: +1 bonus play')},2200);}}
function setActive(i){
 ri=i;rms=0;clearInterval(rt);attOpen=false;clearInterval(attTO);var ae=$('#att');if(ae)ae.classList.remove('on');
 $$('.reel').forEach(function(e,k){e.classList.toggle('act',k===i)});
 var r=FEED[i];if(!r)return;
 if(st.clips[r.id]){$('#rbar').style.width='100%';return;}
 $('#rbar').style.width='0';
 if(lockLeft()>0){rmsg('Rewards are paused for '+Math.ceil(lockLeft()/60000)+' more min. We could not verify your recent views.');return;}
 var capOut=st.watchPts>=WATCH_CAP;if(capOut){rmsg('Daily watch limit reached. Come back tomorrow to earn again.');return;}
 var total=r.sec*1000,step=total/50,attAt=total*(0.35+Math.random()*0.3);
 rt=setInterval(function(){if(document.hidden||attOpen)return;rms+=step;$('#rbar').style.width=Math.min(100,rms/total*100)+'%';
  var e=$('[data-earn="'+r.id+'"]');if(e&&rms<total)e.textContent='+'+r.sec+' pts · '+Math.ceil((total-rms)/1000)+'s';
  if(attAt>0&&rms>=attAt&&rms<total){attAt=-1;showAtt(function(ok){if(ok){rmsg('Verified. Keep watching.');return;}rms=0;$('#rbar').style.width='0';st.strikes++;if(st.strikes>=2){st.watchLock=Date.now()+10*60000;st.strikes=0;clearInterval(rt);rmsg('Rewards paused for 10 min. We could not verify that you were watching.');}else{rmsg('We could not verify you were watching. Progress reset. Warning 1 of 2.');attAt=total*0.5;}});}
  if(rms>=total){clearInterval(rt);completeReel(r);}
 },100);
}
function fairPlayHTML(){var p=Math.min(100,Math.round(st.watchPts/WATCH_CAP*100)),lk=lockLeft();
 return '<div class="info"><div class="row"><b style="font-size:15px">Fair play</b><span class="pchip '+(lk?'rf':'ok')+'" style="margin:0">'+(lk?'Rewards paused':'Protected')+'</span></div><div class="meter" style="height:8px;margin-top:10px"><i style="width:'+p+'%"></i></div><p class="fine" style="margin-top:6px">Today: '+st.watchPts+' / '+WATCH_CAP+' points from watching</p>'
 +'<ul class="hl fp"><li>Watch time is checked on our servers, not just in the app.</li><li>Quick “still watching?” checks. Rewards pause when the app is in the background.</li><li>One reward per clip per account, with a daily limit.</li><li>One account per verified phone number and device. Emulators, rooted devices and auto-clickers are blocked.</li><li>Suspicious activity pauses rewards and removes points from flagged views.</li><li>Merchants only pay for verified views.</li></ul></div>';}
function openReels(id){
 FEED=REELS.filter(function(r){return !r.auto||r.id===id});var i=0;FEED.forEach(function(r,k){if(r.id===id)i=k;});
 var sc=$('#rscroll');sc.innerHTML=FEED.map(reelHTML).join('');
 $('#reels').classList.add('on');
 sc.scrollTop=i*sc.clientHeight;setActive(i);
}
function closeReels(){clearInterval(rt);clearInterval(attTO);attOpen=false;$('#att').classList.remove('on');$('#rwreveal').classList.remove('on');$('#reels').classList.remove('on');refresh();}
$('#rclose').addEventListener('click',closeReels);
$('#lbxclose').addEventListener('click',function(){$('#lbx').classList.remove('on')});
document.addEventListener('scroll',function(e){
 var el=e.target;if(!el||!el.id)return;
 if(el.id==='gtrack'){var gi=Math.round(el.scrollLeft/el.clientWidth),gc=$('#gcount');if(gc)gc.textContent=(gi+1)+'/'+el.children.length;$$('#gdots i').forEach(function(x,k){x.classList.toggle('on',k===gi)});}
 if(el.id==='lbxtrack'){var li=Math.round(el.scrollLeft/el.clientWidth);$('#lbxcount').textContent=(li+1)+' / '+el.children.length;}
 if(el.id==='rscroll'){clearTimeout(rdeb);rdeb=setTimeout(function(){var i=Math.round(el.scrollTop/el.clientHeight);if(i!==ri)setActive(i);},120);}
 if(el.id==='adtrack'){var w=el.firstElementChild.offsetWidth+(parseFloat(getComputedStyle(el).columnGap)||0),i2=Math.round(el.scrollLeft/w);$$('#addots i').forEach(function(d,k){d.classList.toggle('on',k===i2)});loUpdate(i2);}
},true);
var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!rm){setInterval(function(){var tr=$('#adtrack');if(!tr||!$('#home.on')||$('#reels.on'))return;var w=tr.firstElementChild.offsetWidth+(parseFloat(getComputedStyle(tr).columnGap)||0),n=tr.children.length,i=(Math.round(tr.scrollLeft/w)+1)%n;tr.scrollTo({left:i*w,behavior:'smooth'});},4500);}


/* ---- Games ---- */
var WHEEL=[{t:'10 points',pts:10,l:'10 pts'},{t:'30 points',pts:30,l:'30 pts'},{t:'Free pastry',m:'sufra',gift:'Free pastry at Starbucks',l:'Free pastry'},{t:'20 points',pts:20,l:'20 pts'},{t:'50 points',pts:50,l:'50 pts'},{t:'SAR 20 off',m:'mode',gift:'SAR 20 off at Mode Atelier',l:'SAR 20 off'},{t:'10 points',pts:10,l:'10 pts'},{t:'30 points',pts:30,l:'30 pts'}];
var QPOOL=[{q:'Which cuisine does Nobu Riyadh serve?',o:['Japanese','French','Indian'],a:0},{q:'A Hot Deal ends when…',o:['Time or quantity runs out, whichever is first','Only at midnight','When you decide'],a:0},{q:'How long is a DealDash voucher valid after purchase?',o:['30 days','90 days','1 year'],a:1},{q:'What do you earn by watching a full reel?',o:['Points and a play','A free coffee','Nothing'],a:0},{q:'Which deals need no code or reservation?',o:['Live Deals','Reserved Hot Deals only','Vouchers only'],a:0},{q:'Where do you find everything you reserved or bought?',o:['My Deals','Settings','Explore'],a:0}];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickPrize(){return PRIZES[Math.floor(Math.random()*PRIZES.length)];}
function winPrize(pr){if(pr.pts){st.points+=pr.pts;st.lifetime+=pr.pts;st.ledger.unshift({t:'Game prize: '+pr.t,p:pr.pts,when:Date.now()});}else addClaim({dealId:'gift'+(++st.giftN),m:pr.m,kind:'gift',title:pr.gift});st.prizes.unshift(pr);st.lastPrize=pr;}
function newGame(k){if(k==='box')return {picked:-1};if(k==='wheel')return {spun:false};if(k==='scratch')return {prize:pickPrize()};
 if(k==='memory'){var ids=['sufra','smash','volt','stride','kozo','atrium'];return {deck:shuffle(ids.concat(ids)),open:[],matched:{},moves:0,pairs:0,lock:false};}
 return {q:shuffle(QPOOL).slice(0,3),i:0,score:0,ans:null};}
function openGame(k){if(st.plays<1){toast('No plays left. Watch a reel to earn one');return;}st.plays--;st.game=k;st.gs=newGame(k);$('#game').classList.add('on');renderGame();}
function finishGame(pr){if(st.gs.done)return;winPrize(pr);st.gs.done=pr;renderGame();}
function closeGame(){$('#game').classList.remove('on');st.game=null;refresh();}
function wheelSVG(){var n=WHEEL.length,col=['#5B1AFC','#E93A52','#0F0C42','#F5A524','#7E4DFF','#1FBF8F','#4A12D6','#FF7A1A'],out='';
 for(var i=0;i<n;i++){var a0=(i*45-90)*Math.PI/180,a1=((i+1)*45-90)*Math.PI/180,x0=Math.cos(a0)*96,y0=Math.sin(a0)*96,x1=Math.cos(a1)*96,y1=Math.sin(a1)*96;
  out+='<path d="M0 0L'+x0.toFixed(2)+' '+y0.toFixed(2)+'A96 96 0 0 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'Z" fill="'+col[i]+'" stroke="#fff" stroke-width="1.5"/><text transform="rotate('+(i*45+22.5)+') translate(0,-62)" text-anchor="middle" fill="#fff" font-size="9.5" font-weight="800" font-family="sans-serif">'+WHEEL[i].l+'</text>';}
 return '<svg viewBox="-100 -100 200 200" width="100%" aria-label="Prize wheel"><g id="wheelg" style="transform-origin:0 0">'+out+'</g><circle r="14" fill="#fff" stroke="#0F0C42" stroke-width="3"/></svg>';}
function gameBodyHTML(){var k=st.game,g=st.gs,h='';
 if(k==='box'){h='<p class="fine" style="margin-bottom:14px">Pick a gift box.</p><div class="gifts" style="margin:0">'+[0,1,2].map(function(i){return '<button class="gift gbx" data-act="gbox" data-p="'+i+'" aria-label="Gift box '+(i+1)+'">Tap</button>'}).join('')+'</div>';}
 else if(k==='wheel'){h='<p class="fine" style="margin-bottom:6px;text-align:center">Spin once and see where it lands.</p><div class="wheelwrap"><span class="wptr" aria-hidden="true"></span>'+wheelSVG()+'</div><button class="btn" id="spinbtn" style="display:block;width:100%;margin-top:18px" data-act="gspin">Spin the wheel</button>';}
 else if(k==='scratch'){h='<p class="fine" style="margin-bottom:12px;text-align:center">Scratch the silver area to reveal your prize.</p><div class="scratchbox"><div class="scprize">'+ic(g.prize.gift?'gift':'spark',30)+'<b>'+g.prize.t+'</b></div><canvas id="scv" width="300" height="170" aria-label="Scratch area"></canvas></div><button class="btn ghost" style="display:block;width:100%;margin-top:16px" data-act="greveal">Reveal all</button>';}
 else if(k==='memory'){h='<div class="row" style="margin-bottom:12px"><p class="fine">Match the six pairs. Fewer moves, bigger prize.</p><b>Moves <span id="gmoves">'+g.moves+'</span></b></div><div class="mgrid">'+g.deck.map(function(id,i){return '<button class="mc" data-act="gcard" data-p="'+i+'" aria-label="Card '+(i+1)+'"><span class="mci"><span class="mcb">?</span><span class="mcf">'+art(M[id])+'</span></span></button>'}).join('')+'</div>';}
 else{var q=g.q[g.i];h='<div class="row" style="margin-bottom:10px"><span class="fine">Question '+(g.i+1)+' of 3</span><b>Score '+g.score+'</b></div><h3 style="font-size:19px;line-height:1.3;margin-bottom:14px">'+q.q+'</h3><div class="stack" style="padding:0">'+q.o.map(function(o,i){return '<button class="qo" data-act="gans" data-p="'+i+'">'+o+'</button>'}).join('')+'</div>';}
 return h;}
function resultHTML(pr){var cf='';for(var i=0;i<14;i++)cf+='<i style="left:'+(4+i*7)+'%;background:'+['#5B1AFC','#E93A52','#F5A524','#1FBF8F'][i%4]+';animation-delay:'+(i%5)*0.12+'s"></i>';
 return '<div class="gres"><div class="conf" aria-hidden="true">'+cf+'</div><div class="gresi">'+ic(pr.gift?'gift':'spark',36)+'</div><h2>You won '+(pr.gift?pr.gift:pr.t)+'</h2><p class="fine">'+(pr.gift?'A gift from '+M[pr.m].name+'. Added to My Deals.':'Added to your points. You now have '+fmtN(st.points)+'.')+'</p><div class="gbtns">'+(st.plays>0?'<button class="btn" data-act="gagain">Play again ('+st.plays+' left)</button>':'<button class="btn" data-act="gwatch">Watch a reel to earn a play</button>')+'<button class="btn ghost" data-act="gexit">More games</button></div></div>';}
function renderGame(){var g=GAMES.filter(function(x){return x.k===st.game})[0];
 $('#game').innerHTML='<div class="gh"><button data-act="gexit" aria-label="Back to games">'+ic('back')+'</button><h2>'+g.n+'</h2><span class="gplays">'+st.plays+' play'+(st.plays===1?'':'s')+' left</span></div><div class="gbody" id="gbody">'+(st.gs.done?resultHTML(st.gs.done):gameBodyHTML())+'</div>';
 if(st.game==='scratch'&&!st.gs.done)initScratch();}
function initScratch(){var cv=$('#scv');if(!cv||!cv.getContext)return;var ctx=cv.getContext('2d');if(!ctx)return;var w=cv.width,h=cv.height,gr=ctx.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#C9CCDA');gr.addColorStop(.5,'#EEF0F8');gr.addColorStop(1,'#B7BBCB');ctx.fillStyle=gr;ctx.fillRect(0,0,w,h);ctx.fillStyle='#7A7F99';ctx.font='800 20px sans-serif';ctx.textAlign='center';ctx.fillText('SCRATCH HERE',w/2,h/2+7);
 var down=false,n=0;function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*w/r.width,y:(e.clientY-r.top)*h/r.height};}
 function check(){var d=ctx.getImageData(0,0,w,h).data,c=0,t=0;for(var i=3;i<d.length;i+=160){t++;if(d[i]===0)c++;}if(c/t>0.45)finishGame(st.gs.prize);}
 function scr(e){if(!down||st.gs.done)return;var p=pos(e);ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(p.x,p.y,20,0,7);ctx.fill();if(++n%6===0)check();}
 cv.addEventListener('pointerdown',function(e){down=true;if(cv.setPointerCapture)cv.setPointerCapture(e.pointerId);scr(e);});cv.addEventListener('pointermove',scr);cv.addEventListener('pointerup',function(){down=false});cv.addEventListener('pointercancel',function(){down=false});}

/* Play & Win */
function openGift(i){
 if(st.plays<1){toast('No plays left. Watch a clip to earn one');return;}
 st.plays--;var pr=PRIZES[st.giftN%PRIZES.length];st.giftN++;st.lastPrize=pr;st.prizes.unshift(pr);st.lastOpen=i;
 if(pr.pts){st.points+=pr.pts;}else{addClaim({dealId:'gift'+st.giftN,m:pr.m,kind:'gift',title:pr.gift});}
 refresh();
 setTimeout(function(){st.lastOpen=-1;var tt=st.stack[st.stack.length-1];if(tt.id==='wallet'&&st.rtab==='play')refresh();},2200);
}

/* Real-time feel: other customers reserve while you browse (demo) */
setInterval(function(){var c=D.filter(function(d){return d.type==='limited'&&d.left>3&&d.end>Date.now()});if(!c.length)return;var d=c[Math.floor(Math.random()*c.length)];d.left--;liveUpdate(d);},15000);
/* Live countdowns */
setInterval(function(){
 $$('[data-exp]').forEach(function(el){var left=parseInt(el.getAttribute('data-exp'),10)-Date.now();el.textContent=left>0?(el.hasAttribute('data-dh')?fmtDH(left):el.hasAttribute('data-lft')?fmtLeft(left):el.hasAttribute('data-short')?fmtShort(left):fmt(left)):'Ended';});
},1000);

show('signin',undefined,false);
})();
