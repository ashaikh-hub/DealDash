<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title>DealDash Staff · Mobile design mockups</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F0C42;--purple:#5B1AFC;--purple2:#7E4DFF;--p50:#F6F3FF;--p300:#B9A4FF;--lilac:#EEE8FF;--bg:#F8F9FD;--ink2:#5B5E80;--ink3:#6F7296;--line:#E3E1F0;--sl:#EEF0F8;--mint:#1FBF8F;--stage:#E9E7F5;
--s-bg:#E2F7F0;--s-tx:#0B7A5A;--s-solid:#0E8F6A;--w-bg:#FEF1D9;--w-tx:#8A5A00;--w-solid:#B26B00;--d-bg:#FDE8EB;--d-tx:#B3203A;--d-solid:#C9213D;--shadow:0 1px 2px rgba(20,22,58,.06),0 6px 18px rgba(20,22,58,.07)}
*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--stage);color:var(--navy);font-size:14px;line-height:20px;font-weight:500;-webkit-font-smoothing:antialiased}
.ar,[dir=rtl] .phone{font-family:'IBM Plex Sans Arabic','Plus Jakarta Sans',sans-serif}
h1,h2,h3,p{margin:0}button{font-family:inherit;cursor:pointer}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}svg.i.l{width:30px;height:30px}svg.i.xl{width:44px;height:44px;stroke-width:2.2}
.rtl .mir{transform:scaleX(-1)}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:50;background:#0A0830;color:#fff;padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.bar b{color:#C9C3FF;margin-inline-end:8px}.bar button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:99px;padding:6px 12px;font-weight:700;font-size:12px}.bar button.on{background:#fff;color:var(--navy)}
.wrap{max-width:1500px;margin:0 auto;padding:28px 24px 60px}
.sec{margin:0 0 44px}.sec h2{font-size:22px;line-height:30px;font-weight:800;margin-bottom:4px}.sec .d{color:var(--ink2);margin-bottom:18px;max-width:900px}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:10px;align-items:center}.cap{font-size:12px;font-weight:700;color:var(--ink2);text-align:center;max-width:300px}
/* phone */
.phone{width:320px;height:660px;background:#fff;border-radius:38px;border:9px solid var(--navy);overflow:hidden;position:relative;box-shadow:0 22px 44px rgba(15,12,66,.25);display:flex;flex-direction:column}
.phone.big{width:360px;height:740px}
.phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:96px;height:20px;background:var(--navy);border-radius:0 0 14px 14px;z-index:20}
.sb{height:32px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 4px;font-size:11px;font-weight:700;color:var(--navy)}
.scr{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg);position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.wm{font-weight:800;font-size:19px;letter-spacing:-.02em;direction:ltr;display:inline-block}.wm i{font-style:normal;color:var(--purple)}
.ctx{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.ctx b{color:var(--navy)}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:99px;border:1px solid transparent;font-weight:800;font-size:16px;width:100%}
.btn.p{background:var(--purple);color:#fff}.btn.t{background:var(--lilac);color:var(--purple)}.btn.o{background:#fff;border-color:var(--line);color:var(--navy)}
.btn.g{background:var(--s-solid);color:#fff}.btn.sm{height:44px;font-size:14px}.btn.d{background:var(--d-bg);color:var(--d-tx)}
.btn.dis{background:var(--sl);color:var(--ink3)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:800}
.chip.ok{background:var(--s-bg);color:var(--s-tx)}.chip.w{background:var(--w-bg);color:var(--w-tx)}.chip.d{background:var(--d-bg);color:var(--d-tx)}.chip.n{background:var(--lilac);color:var(--purple)}.chip.g{background:var(--sl);color:var(--ink2)}
.bn{display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 10px 12px;justify-content:space-around}
.bn div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink3);padding:6px 18px;border-radius:14px;min-width:84px}
.bn div.on{color:var(--purple);background:var(--lilac)}
.field{border:1px solid var(--line);border-radius:16px;height:56px;display:flex;align-items:center;padding:0 16px;background:#fff;font-size:16px;font-weight:600}
.field.f{border-color:var(--purple2);background:var(--p50);box-shadow:0 0 0 3px rgba(126,77,255,.15)}
.lbl{font-size:13px;font-weight:700;margin-bottom:6px}
.otp{display:flex;gap:8px;direction:ltr}.otp i{flex:1;height:58px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:22px;background:#fff}
.otp i.f{border-color:var(--purple2);background:var(--p50)}.otp i.e{border-color:var(--d-solid);background:var(--d-bg)}
.help{font-size:12px;color:var(--ink2)}
.ban{display:flex;gap:10px;padding:12px 14px;border-radius:16px;font-size:13px;font-weight:600;align-items:flex-start}
.ban.w{background:var(--w-bg);color:#5a3b00}.ban.d{background:var(--d-bg);color:#6b1020}.ban.n{background:var(--lilac)}.ban.ok{background:var(--s-bg);color:#064d3a}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
/* scanner */
.cam{flex:1;margin:12px 16px 0;border-radius:28px;background:radial-gradient(circle at 30% 20%,#2c2a5e 0,transparent 55%),radial-gradient(circle at 80% 80%,#3a1f66 0,transparent 55%),#0b0a2a;position:relative;overflow:hidden;min-height:0;display:grid;place-items:center}
.frame{width:56%;aspect-ratio:1;position:relative;margin-top:-34px}
.frame::before,.frame::after,.frame i::before,.frame i::after{content:"";position:absolute;width:34px;height:34px;border:4px solid #fff;border-radius:10px}
.frame::before{top:0;inset-inline-start:0;border-right:0;border-bottom:0}.frame::after{top:0;inset-inline-end:0;border-left:0;border-bottom:0}
.frame i::before{bottom:0;inset-inline-start:0;border-right:0;border-top:0}.frame i::after{bottom:0;inset-inline-end:0;border-left:0;border-top:0}
.scanline{position:absolute;inset-inline:6%;top:48%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#B9A4FF,transparent);box-shadow:0 0 14px #7E4DFF}
.camhint{position:absolute;bottom:14px;inset-inline:0;text-align:center;color:#fff;font-size:13px;font-weight:700}
.camtop{position:absolute;top:12px;inset-inline:12px;display:flex;justify-content:space-between}
.camtop span{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.stats{display:flex;gap:10px;padding:12px 16px 0}
.stats .card{flex:1;padding:12px 14px}.stats b{display:block;font-size:22px;line-height:26px;font-weight:800}.stats span{font-size:12px;color:var(--ink2);font-weight:600}
/* result */
.res{flex:1;display:flex;flex-direction:column;min-height:0}
.res-h{padding:22px 20px 26px;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;border-radius:0 0 30px 30px}
.res-h .ic{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.res-h h2{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.01em}.res-h p{font-size:14px;opacity:.95;max-width:260px;font-weight:600}
.r-ok{background:var(--s-solid)}.r-no{background:var(--d-solid)}.r-wr{background:var(--w-solid)}.r-gy{background:#4b4e75}
.res-b{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}.kv span{color:var(--ink2);font-weight:600}.kv b{text-align:end;font-weight:800}
.big{font-size:30px;line-height:36px;font-weight:800;letter-spacing:-.01em}
.itm{display:flex;gap:12px;align-items:center}.th{width:52px;height:52px;border-radius:14px;flex:none}
.p1{background:radial-gradient(circle at 25% 30%,#f6c07a 0,transparent 38%),radial-gradient(circle at 75% 65%,#c2562f 0,transparent 45%),#2a1410}
.p2{background:radial-gradient(circle at 30% 70%,#9d7bff 0,transparent 40%),radial-gradient(circle at 75% 30%,#e8c46a 0,transparent 38%),#1b1450}
.p3{background:radial-gradient(circle at 70% 30%,#f2a1b8 0,transparent 40%),#2a1230}
.sheet{position:absolute;inset:0;background:rgba(15,12,66,.45);display:flex;align-items:flex-end;z-index:10}
.sh{background:#fff;border-radius:28px 28px 0 0;padding:14px 18px 22px;width:100%;display:flex;flex-direction:column;gap:12px}
.grab{width:42px;height:5px;border-radius:3px;background:#D5D3E6;margin:0 auto 4px}
.list .li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.list .li:last-child{border:0}
.li .tx{flex:1;min-width:0}.li b{display:block;font-weight:800}.li span{font-size:12px;color:var(--ink2)}
.seg{display:flex;background:var(--lilac);border-radius:99px;padding:3px}.seg span{flex:1;text-align:center;padding:8px 4px;border-radius:99px;font-size:12px;font-weight:800;color:var(--ink2)}.seg span.on{background:#fff;color:var(--purple);box-shadow:var(--shadow)}
.srch{display:flex;gap:8px;align-items:center;height:46px;border-radius:99px;background:#fff;border:1px solid var(--line);padding:0 14px;color:var(--ink3);font-size:14px}
.pulse{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:pl 1.8s infinite}@keyframes pl{70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.rtl{direction:rtl}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.legend span{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700}.legend i{width:14px;height:14px;border-radius:5px}
.tb{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;font-size:13px}.tb th{background:var(--p50);text-align:start;padding:10px 12px;font-size:12px;color:var(--ink2)}.tb td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.note{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;max-width:360px;font-size:13px;line-height:20px}
.note b{display:block;margin-bottom:4px}
.proto{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.nav{display:flex;gap:6px;flex-wrap:wrap;max-width:420px}.nav button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:12px}
</style>
</head>

function proto(){

 let i=2;

  document.getElementById('pp').innerHTML=html.replace('class="phone"','class="phone big"').replace('class="phone big big"','class="phone big"');};
 setTimeout(()=>{render();
  document.getElementById('pn').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;i=+b.dataset.i;render();document.querySelectorAll('#pn button').forEach(x=>x.classList.toggle('on',x===b));});},0);
 const names=['Sign in','Enter code','Scanner (Home)','Manual code','Valid result','Confirm','Processing','Success','History','No connection','Already redeemed','Invalid'];
 return `<div class="sec"><h2>Interactive journey</h2><p class="d">Pick a step to see it in the phone. The core journey is <b>Scan → Validate → Redeem</b> in three taps: <b>Scan</b> → <b>Redeem</b> → <b>Confirm</b>.</p><div class="proto"><div id="pp"></div><div><div class="nav" id="pn">${names.map((n,j)=>`<button data-i="${j}" class="${j===2?'on':''}">${j+1}. ${n}</button>`).join('')}</div>

 <div class="note"><b>The whole job in three taps</b>1. Scan the customer’s QR (or type the code). 2. Read one big colour result and tap <b>Redeem</b>. 3. <b>Confirm</b>. Then <b>Scan next</b>.</div>

 <div class="note"><b>What staff cannot do</b>Reverse a redemption. A manager or DealDash does that, with a reason and an audit record.</div></div></div></div></div>`;
}

function states(){
 return sec('Failure and edge-case states','What staff see when something goes wrong.',cell(S.result('en','invalid'),'Invalid code')+cell(S.offline('en'),'No connection (scan preserved, redeem disabled)')+cell(S.camdenied('en'),'Camera denied')+cell(S.loadingConfirm('en'),'Double-tap protection')+cell(S.otp('en','err'),'OTP error')+cell(S.access('en'),'No branch assigned'))
 +`<div class="sec"><h2>Validation result matrix</h2><p class="d">Every outcome, what staff see, and the next action.</p><table class="tb"><thead><tr><th>Result</th><th>Colour</th><th>What it means</th><th>Details shown</th><th>Primary action</th></tr></thead><tbody>
 <tr><td><b>Valid</b></td><td>Green</td><td>Can be redeemed here, now</td><td>Item, type, first name, value/benefit, validity, branch</td><td>Redeem → Confirm</td></tr>
 <tr><td><b>Invalid</b></td><td>Red</td><td>Code not recognised</td><td>None</td><td>Scan again / Enter code</td></tr>
 <tr><td><b>Expired</b></td><td>Red</td><td>Past validity</td><td>Item, expiry date</td><td>Scan next</td></tr>
 <tr><td><b>Already redeemed</b></td><td>Amber</td><td>Used earlier</td><td>When and where (own merchant only)</td><td>Scan next / Contact manager</td></tr>
 <tr><td><b>Wrong branch</b></td><td>Amber</td><td>Valid elsewhere</td><td>The branches where it works</td><td>Scan next</td></tr>
 <tr><td><b>Eligibility failed</b></td><td>Amber</td><td>Only for free restricted offers/reservations that need current eligibility. <b>Never for a paid voucher bought while eligible.</b></td><td>What is needed</td><td>Scan next / Contact manager</td></tr>
 <tr><td><b>Reservation expired</b></td><td>Red</td><td>Hold timed out</td><td>Item, hold end time</td><td>Scan next</td></tr>
 <tr><td><b>Reservation not completed</b></td><td>Grey</td><td>Reservation no longer available</td><td>None</td><td>Scan next</td></tr>
 <tr><td><b>Not valid yet</b></td><td>Grey</td><td>Starts later</td><td>Start time</td><td>Scan next</td></tr>
 <tr><td><b>On hold / refunded / cancelled</b></td><td>Grey</td><td>Cannot be redeemed</td><td>None (neutral wording)</td><td>Contact manager</td></tr></tbody></table></div>`;
}
function view(v){ document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 document.documentElement.dir='ltr';
 app.innerHTML = v==='proto'?proto(): v==='gallery'?gallery('en'): v==='ar'?ar(): states();
 if(v==='proto'){ /* init */ } window.scrollTo(0,0); }
document.querySelector('.bar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)view(b.dataset.v)});
view((location.hash||'#proto').slice(1)||'proto');
</script>
</body>
